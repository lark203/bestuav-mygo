# 持续集成：静态检查 + 单测 + 模板快照一致性。
#
# 为什么需要：发布用的「新建项目」模板是 internal/scaffold/testdata/template 里的
# 一份快照（脚本 scripts/snapshot-template.py 生成）。改了主工程却忘了重新快照，
# 生成出来的新项目就是旧代码——这里用 --check 把它变成硬失败。
#
# 与 release.yml 的分工：本文件只管「代码是否健康」，不发版、不碰 secrets。

name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read
  # 失败时用 commit status 回传第一条失败信息（公开可读，不需要登录）。
  statuses: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        shell: bash
        run: |
          set -euo pipefail
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "::error::以下文件未格式化，请运行 gofmt -w："
            echo "$out"
            exit 1
          fi

      - name: 模板快照与主工程一致
        shell: bash
        run: python3 scripts/snapshot-template.py --check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        shell: bash
        run: |
          # 日志写在工作目录（Git Bash 下 $RUNNER_TEMP 的反斜杠路径不可靠）。
          go test ./... > test.log 2>&1
          status=$?
          cat test.log
          if [ "$status" -ne 0 ]; then
            # 把第一条失败写成注解：check-run 的 annotations 不需要登录就能从
            # API 读到，而 job 日志要登录才能下载。
            first=$(grep -a -m1 -E '^(--- FAIL|FAIL|panic:)' test.log || true)
            if [ -z "$first" ]; then
              first=$(tail -n 1 test.log)
            fi
            echo "::error file=go-test.log,line=1,title=go-test::${first}"
            exit "$status"
          fi
          rm -f test.log

      # 失败时把第一条失败写进 commit status：job 日志需要登录才能下载，而
      # commit status 是公开可读的，`git` / API 都能拿到，排查 CI 很省事。
      - name: report failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OS_NAME: ${{ matrix.os }}
        run: |
          # 取「--- FAIL: TestX」以及紧随其后的断言那一行（file.go:NN: 原因）。
          msg=$(grep -a -m1 -A1 -E '^(--- FAIL|panic:)' test.log 2>/dev/null | tr '\n' ' ' | tr -s ' ' | head -c 130 || true)
          if [ -z "$msg" ]; then msg="unknown failure"; fi
          msg=$(printf '%s' "$msg" | tr -d '"[\]' | tr -s ' ')
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"failure\",\"context\":\"ci/$OS_NAME\",\"description\":\"$msg\"}" >/dev/null || true
